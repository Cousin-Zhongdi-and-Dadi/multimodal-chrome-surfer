<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多模态浏览器助手</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1d21;
        --bg-soft: #232529;
        --bg-code: #16181c;
        --border: #33363b;
        --text: #e8eaed;
        --text-dim: #9aa0a6;
        --accent: #4c8dff;
        --accent-soft: rgba(76, 141, 255, 0.15);
        --accent-contrast: #3f74d9;
        --user: #2b6e3b;
        --assistant: #2f3440;
        --danger: #e5534b;
        --warn: #d9a441;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 13px;
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--bg-soft);
        flex: 0 0 auto;
      }

      .app-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 14px;
      }

      .app-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-dim);
      }

      .status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
      }

      .status.connected .dot {
        background: #3fb950;
      }

      .status.disconnected .dot {
        background: var(--danger);
      }

      .activity-card {
        margin: 10px 14px 0;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-code);
        color: var(--text-dim);
        font-family: "Cascadia Code", "Consolas", monospace;
        font-size: 12px;
        line-height: 1.45;
        min-height: 2em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .activity-card.error {
        border-color: var(--danger);
        color: #ffb3ae;
      }

      .working-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 14px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent-contrast);
        font-size: 12px;
      }

      .working-indicator[hidden] {
        display: none;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid color-mix(in srgb, var(--accent-contrast) 35%, transparent);
        border-top-color: var(--accent-contrast);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .messages {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scrollbar-width: thin;
      }

      .row {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .row.user {
        align-items: flex-end;
      }

      .row.assistant,
      .row.question {
        align-items: stretch;
      }

      .meta {
        font-size: 11px;
        color: var(--text-dim);
        padding: 0 4px;
      }

      .bubble {
        max-width: 96%;
        border-radius: 12px;
        padding: 8px 11px;
        line-height: 1.55;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .row.user .bubble {
        background: var(--user);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .row.assistant .bubble {
        background: var(--assistant);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }

      .row.event .bubble {
        background: var(--bg-soft);
        border: 1px solid var(--border);
        color: var(--text-dim);
        font-family: "Cascadia Code", "Consolas", monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }

      .row.system .bubble {
        align-self: center;
        background: var(--accent-soft);
        color: var(--accent-contrast);
        font-size: 12px;
        border-radius: 8px;
      }

      .row.error .bubble {
        background: rgba(229, 83, 75, 0.15);
        border: 1px solid rgba(229, 83, 75, 0.4);
        color: #ffb3ae;
      }

      .row.assistant .bubble p,
      .row.assistant .bubble ul,
      .row.assistant .bubble ol,
      .row.assistant .bubble blockquote,
      .row.assistant .bubble pre,
      .row.assistant .bubble table {
        margin: 6px 0;
      }

      .row.assistant .bubble ul,
      .row.assistant .bubble ol {
        padding-left: 20px;
      }

      .row.assistant .bubble code {
        background: var(--bg-code);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 4px;
        font-family: "Cascadia Code", "Consolas", monospace;
      }

      .row.assistant .bubble pre {
        background: var(--bg-code);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 11px;
        overflow: auto;
        white-space: pre-wrap;
      }

      .row.assistant .bubble pre code {
        background: transparent;
        border: 0;
        padding: 0;
      }

      .row.assistant .bubble table {
        border-collapse: collapse;
        width: 100%;
      }

      .row.assistant .bubble th,
      .row.assistant .bubble td {
        border: 1px solid var(--border);
        padding: 5px 7px;
      }

      .row.assistant .bubble a {
        color: var(--accent);
      }

      .row.assistant .bubble blockquote {
        border-left: 3px solid var(--accent);
        margin-left: 0;
        padding-left: 10px;
        color: var(--text-dim);
      }

      .question {
        background: rgba(217, 164, 65, 0.12);
        border: 1px solid rgba(217, 164, 65, 0.45);
        border-radius: 10px;
        padding: 10px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .question .q-label {
        width: 100%;
        grid-column: 1 / -1;
        color: var(--warn);
        margin-bottom: 2px;
      }

      .question input {
        grid-column: 1;
        background: var(--bg-code);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 7px 9px;
        font: inherit;
      }

      .question button {
        grid-column: 2;
      }

      .composer {
        flex: 0 0 auto;
        border-top: 1px solid var(--border);
        background: var(--bg-soft);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .composer textarea {
        width: 100%;
        resize: none;
        background: var(--bg-code);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 9px 11px;
        font: inherit;
        line-height: 1.4;
        min-height: calc(1.4em * 3 + 18px);
        max-height: 200px;
      }

      .composer textarea:focus {
        outline: none;
        border-color: var(--accent);
      }

      .composer-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      button {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        border-radius: 7px;
        padding: 7px 14px;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: #6ba0ff;
      }

      button.ghost {
        color: var(--text-dim);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f6f8;
          --bg-soft: #ffffff;
          --bg-code: #eef0f3;
          --border: #dcdfe4;
          --text: #1f2328;
          --text-dim: #6a737d;
          --accent-contrast: #1d4ed8;
          --assistant: #ffffff;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="app-title">
        <span class="app-logo">◆</span>
        <span>多模态浏览器助手</span>
      </div>
      <div id="status" class="status">
        <span class="dot"></span>
        <span class="status-text">连接中</span>
      </div>
    </header>

    <main id="output" class="messages" aria-live="polite"></main>

    <div id="working-indicator" class="working-indicator" hidden>
      <span class="spinner"></span>
      <span>正在工作</span>
    </div>

    <footer class="composer">
      <textarea
        id="task"
        rows="3"
        placeholder="例如：在 B 站找到影视飓风最新视频，并跳转到 2 分 30 秒"
      ></textarea>
      <div class="composer-actions">
        <button id="stop" class="ghost" type="button" disabled>停止</button>
        <button id="send" class="primary" type="button">发送</button>
      </div>
    </footer>

    <script src="vendor/marked.min.js"></script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
